[workspace]
resolver = "3"
members = ["client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/SvarogLab/sockrelay"
description = "Relays a Windows ssh-agent named pipe to a WSL/Linux unix socket over a single multiplexed connection, so parallel SSH connections stop each spawning their own Windows-side process"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat", "io", "rt"] }
yamux = "0.14.1"
tracing = "0.1.44"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
librelay = { git = "https://github.com/SvarogLab/librelay", tag = "v0.1.0", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes", "Win32_Foundation"] }
rand = "0.10.3"

[workspace.lints.clippy]
# A module with submodules lives in `name.rs` beside `name/`, not in `name/mod.rs`.
mod_module_files = "warn"
