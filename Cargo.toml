[workspace]
resolver = "3"
members = ["client", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/SvarogLab/sockrelay"
description = "Relays a Windows ssh-agent named pipe to a WSL/Linux unix socket over a single multiplexed connection, so parallel SSH connections stop each spawning their own Windows-side process"

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["compat", "io"] }
yamux = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.19"
futures = "0.3.33"
libc = "0.2.189"
clap = { version = "4.6.4", features = ["derive"] }
sd-notify = "0.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Pipes", "Win32_Foundation"] }
rand = "0.10.2"

[workspace.lints.clippy]
# A module with submodules lives in `name.rs` beside `name/`, not in `name/mod.rs`.
mod_module_files = "warn"
