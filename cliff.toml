# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """\
# Changelog

All notable changes to this project will be documented in this file.

This project adheres to [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)
and follows [Semantic Versioning](https://semver.org/).
"""

# Tera template rendered for each release.
body = """{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}- {{ commit.message | upper_first }}
{% endfor -%}
{% if not loop.last %}

{% endif -%}
{% endfor -%}
"""

trim = true
render_always = true

postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/ffaxl/tools-sockrelay" },
  # Collapse excessive vertical whitespace introduced by templating.
  { pattern = "(\\r?\\n){3,}", replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = true

# Matches tags like v0.2.2
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z0-9]+)?"

commit_parsers = [
  { message = "^feat", group = "Added ✨" },
  { message = "^fix", group = "Fixed 🐛" },
  { message = "^refactor", group = "Changed 🔧" },
  { message = "^perf", group = "Performance 🚀" },
  { message = "^docs", group = "Documentation 📚" },
  { message = "^test", group = "Tests ✅" },
  { message = "^ci", group = "CI/CD ⚙️" },
  { message = "^style", group = "Style 🎨" },
  { message = "^build", group = "Build system 🛠️" },
  { message = "^revert", group = "Reverts ⏪" },
  { message = "^chore: (version bump|release|update changelog)", skip = true },
  { message = "^chore", group = "Miscellaneous 🧹" },
]

sort_commits = "oldest"
